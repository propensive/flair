name: CI

# Build and test every pull request and every merge into main, via the shared Soundness-application
# workflow — see propensive/.github for what it does and what it expects of this repository (the
# ./mill wrapper, etc/shared, and the pins in etc/refs). The launcher resolves flare-plugin and
# flare-client as published coordinates, so both are published locally first: `flare.__` is
# Mill's wildcard, which resolves `publishLocal` to exactly the publishable modules.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    uses: propensive/.github/.github/workflows/scala-ci.yml@main
    with:
      compile:       flare.plugin.compile flare.client.compile
      publish_local: flare.__
      assembly:      flare.launcher.assembly
      test_assembly: flare.test.assembly
