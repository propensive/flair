name: CI

# Build and test every pull request and every merge into main, via the shared Soundness-application
# workflow — see propensive/.github for what it does and what it expects of this repository (the
# ./mill wrapper, etc/shared, and the pins in etc/refs). The launcher resolves flair-plugin and
# flair-client as published coordinates, so both are published locally first: `flair.__` is
# Mill's wildcard, which resolves `publishLocal` to exactly the publishable modules.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    uses: propensive/.github/.github/workflows/scala-ci.yml@main
    with:
      compile:       flair.plugin.compile flair.client.compile
      publish_local: flair.__
      assembly:      flair.launcher.assembly
      test_assembly: flair.test.assembly
